<svg width="1000" viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" style="background:white">
  <title>Local Minima vs Global Minimum</title>
  <desc>경사하강법이 지역 극솟값에 빠져 전역 최솟값을 찾지 못하는 현상</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ax" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 제목 -->
  <text x="500" y="30" font-family="sans-serif" font-size="16" font-weight="600" fill="#2C2C2A" text-anchor="middle">Local Minima (지역 극솟값) 문제</text>

  <!-- 축 -->
  <line x1="50" y1="330" x2="960" y2="330" stroke="#888780" stroke-width="1.2" marker-end="url(#ax)"/>
  <line x1="70" y1="345" x2="70" y2="55" stroke="#888780" stroke-width="1.2" marker-end="url(#ax)"/>
  <text x="968" y="334" font-family="sans-serif" font-size="13" fill="#888780">x</text>
  <text x="58" y="52" font-family="sans-serif" font-size="13" fill="#888780">f(x)</text>

  <!-- 울퉁불퉁한 곡선: 여러 극솟값을 가진 함수
       구간별로 설계:
       - 시작 (x=80, y=80) 높은 곳
       - 첫번째 local min (x=220, y=210)
       - 봉우리 (x=340, y=130)
       - 두번째 local min (x=460, y=195)
       - 봉우리 (x=570, y=110)
       - 세번째 local min / global min (x=720, y=270)
       - 올라감 (x=880, y=120)
  -->
  <path d="
    M80,80
    C120,80 160,240 220,210
    C260,190 300,130 340,130
    C375,130 415,200 460,195
    C500,190 535,110 570,110
    C610,110 650,270 720,270
    C770,270 820,120 880,120
    C910,120 940,130 960,140
  " fill="none" stroke="#444441" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ── Local Minima 1 (x=220, y=210) ── -->
  <circle cx="220" cy="210" r="6" fill="#D85A30"/>
  <line x1="220" y1="210" x2="220" y2="330" stroke="#D85A30" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="220" y="350" font-family="sans-serif" font-size="12" fill="#D85A30" text-anchor="middle">local min</text>

  <!-- ── Local Minima 2 (x=460, y=195) ── -->
  <circle cx="460" cy="195" r="6" fill="#D85A30"/>
  <line x1="460" y1="195" x2="460" y2="330" stroke="#D85A30" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="460" y="350" font-family="sans-serif" font-size="12" fill="#D85A30" text-anchor="middle">local min</text>

  <!-- ── Global Minimum (x=720, y=270) ── -->
  <circle cx="720" cy="270" r="8" fill="#0F6E56"/>
  <line x1="720" y1="270" x2="720" y2="330" stroke="#0F6E56" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="720" y="350" font-family="sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle" font-weight="600">global min</text>

  <!-- ── 경로 1: local min에 갇히는 경우 (왼쪽 출발 → local min 1) ── -->
  <!-- 시작점: x=130, y=곡선위 -->
  <circle cx="130" cy="105" r="7" fill="#185FA5" stroke="white" stroke-width="2"/>
  <circle cx="175" cy="165" r="7" fill="#185FA5" stroke="white" stroke-width="2"/>
  <circle cx="205" cy="207" r="7" fill="#185FA5" stroke="white" stroke-width="2"/>
  <!-- 화살표 -->
  <path d="M131,106 Q150,130 173,164" fill="none" stroke="#185FA5" stroke-width="2.4" marker-end="url(#ar)"/>
  <path d="M177,165 Q188,182 203,206" fill="none" stroke="#185FA5" stroke-width="2.4" marker-end="url(#ar)"/>

  <!-- 갇힘 표시: 진동하며 local min에 수렴 -->
  <circle cx="228" cy="211" r="7" fill="#185FA5" stroke="white" stroke-width="2"/>
  <circle cx="214" cy="210" r="7" fill="#185FA5" stroke="white" stroke-width="2"/>
  <line x1="207" y1="207" x2="226" y2="211" stroke="#185FA5" stroke-width="2.4" marker-end="url(#ar)"/>
  <line x1="226" y1="211" x2="216" y2="210" stroke="#185FA5" stroke-width="2.4" marker-end="url(#ar)"/>

  <!-- "갇힘" 레이블 -->
  <rect x="145" y="125" width="76" height="22" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="183" y="140" font-family="sans-serif" font-size="11" fill="#185FA5" text-anchor="middle">local min에 갇힘</text>
  <line x1="205" y1="147" x2="210" y2="192" stroke="#185FA5" stroke-width="0.8" stroke-dasharray="3,2"/>

  <!-- ── 경로 2: global min 도달 (오른쪽 출발) ── -->
  <circle cx="840" cy="135" r="7" fill="#0F6E56" stroke="white" stroke-width="2"/>
  <circle cx="800" cy="165" r="7" fill="#0F6E56" stroke="white" stroke-width="2"/>
  <circle cx="760" cy="222" r="7" fill="#0F6E56" stroke="white" stroke-width="2"/>
  <circle cx="732" cy="263" r="7" fill="#0F6E56" stroke="white" stroke-width="2"/>
  <!-- 화살표 -->
  <path d="M838,136 Q820,148 802,164" fill="none" stroke="#0F6E56" stroke-width="2.4" marker-end="url(#ar)"/>
  <path d="M798,166 Q780,190 762,221" fill="none" stroke="#0F6E56" stroke-width="2.4" marker-end="url(#ar)"/>
  <path d="M759,223 Q747,241 734,262" fill="none" stroke="#0F6E56" stroke-width="2.4" marker-end="url(#ar)"/>

  <!-- "global min 도달" 레이블 -->
  <rect x="770" y="108" width="100" height="22" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="820" y="123" font-family="sans-serif" font-size="11" fill="#0F6E56" text-anchor="middle">global min 도달</text>
  <line x1="820" y1="130" x2="838" y2="135" stroke="#0F6E56" stroke-width="0.8" stroke-dasharray="3,2"/>

  <!-- 하단 설명 -->
  <text x="500" y="390" font-family="sans-serif" font-size="13" fill="#5F5E5A" text-anchor="middle">시작점에 따라 local minimum에 빠져 global minimum을 찾지 못할 수 있다.</text>
</svg>
