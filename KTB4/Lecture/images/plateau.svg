<svg width="1000" viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" style="background:white">
  <title>Plateau (고원현상)</title>
  <desc>경사하강법에서 기울기가 거의 0에 가까운 평탄한 구간에서 학습이 멈추는 현상</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ax" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 제목 -->
  <text x="500" y="30" font-family="sans-serif" font-size="16" font-weight="600" fill="#2C2C2A" text-anchor="middle">Plateau (고원현상)</text>

  <!-- 축 -->
  <line x1="50" y1="330" x2="960" y2="330" stroke="#888780" stroke-width="1.2" marker-end="url(#ax)"/>
  <line x1="70" y1="345" x2="70" y2="55" stroke="#888780" stroke-width="1.2" marker-end="url(#ax)"/>
  <text x="968" y="334" font-family="sans-serif" font-size="13" fill="#888780">x</text>
  <text x="58" y="52" font-family="sans-serif" font-size="13" fill="#888780">f(x)</text>

  <!-- 곡선: 왼쪽 급경사 → 넓은 평탄 구간(plateau) → 다시 급경사 → global min
       x=80,  y=80   시작 높은 곳
       x=180, y=170  급경사 내려옴
       x=280, y=200  plateau 진입
       x=560, y=205  plateau 끝 (거의 수평)
       x=680, y=260  다시 내려감
       x=800, y=295  global min 근처
       x=900, y=305  global min
       x=950, y=310  올라감
  -->
  <path d="
    M80,80
    C120,80 150,160 180,170
    C210,180 250,198 280,200
    C350,202 490,203 560,205
    C610,207 650,240 700,275
    C740,295 800,305 860,308
    C900,310 930,308 960,305
  " fill="none" stroke="#444441" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- plateau 구간 음영 표시 -->
  <rect x="275" y="130" width="290" height="210" rx="4" fill="#FFF3E0" opacity="0.5"/>
  <line x1="275" y1="130" x2="275" y2="330" stroke="#BA7517" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="565" y1="130" x2="565" y2="330" stroke="#BA7517" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="420" y="125" font-family="sans-serif" font-size="13" font-weight="600" fill="#BA7517" text-anchor="middle">Plateau 구간 (기울기 ≈ 0)</text>

  <!-- global min 표시 -->
  <circle cx="860" cy="308" r="8" fill="#0F6E56"/>
  <line x1="860" y1="308" x2="860" y2="330" stroke="#0F6E56" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="860" y="350" font-family="sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle" font-weight="600">global min</text>

  <!-- 경로: 왼쪽 급경사 구간 (빠르게 내려옴) -->
  <circle cx="100" cy="82" r="7" fill="#185FA5" stroke="white" stroke-width="2"/>
  <circle cx="138" cy="118" r="7" fill="#185FA5" stroke="white" stroke-width="2"/>
  <circle cx="168" cy="158" r="7" fill="#185FA5" stroke="white" stroke-width="2"/>
  <circle cx="192" cy="178" r="7" fill="#185FA5" stroke="white" stroke-width="2"/>

  <path d="M101,83 Q117,98 136,117" fill="none" stroke="#185FA5" stroke-width="2.4" marker-end="url(#ag)"/>
  <path d="M140,118 Q152,135 166,157" fill="none" stroke="#185FA5" stroke-width="2.4" marker-end="url(#ag)"/>
  <path d="M170,158 Q179,167 190,177" fill="none" stroke="#185FA5" stroke-width="2.4" marker-end="url(#ag)"/>

  <!-- plateau 구간: 점들이 거의 안 움직임 -->
  <circle cx="310" cy="201" r="7" fill="#D85A30" stroke="white" stroke-width="2"/>
  <circle cx="360" cy="202" r="7" fill="#D85A30" stroke="white" stroke-width="2"/>
  <circle cx="410" cy="202" r="7" fill="#D85A30" stroke="white" stroke-width="2"/>
  <circle cx="460" cy="203" r="7" fill="#D85A30" stroke="white" stroke-width="2"/>
  <circle cx="510" cy="203" r="7" fill="#D85A30" stroke="white" stroke-width="2"/>
  <circle cx="548" cy="204" r="7" fill="#D85A30" stroke="white" stroke-width="2"/>

  <line x1="319" y1="201" x2="352" y2="202" stroke="#D85A30" stroke-width="2.4" marker-end="url(#ar)"/>
  <line x1="368" y1="202" x2="402" y2="202" stroke="#D85A30" stroke-width="2.4" marker-end="url(#ar)"/>
  <line x1="418" y1="202" x2="452" y2="203" stroke="#D85A30" stroke-width="2.4" marker-end="url(#ar)"/>
  <line x1="468" y1="203" x2="502" y2="203" stroke="#D85A30" stroke-width="2.4" marker-end="url(#ar)"/>
  <line x1="518" y1="203" x2="540" y2="204" stroke="#D85A30" stroke-width="2.4" marker-end="url(#ar)"/>

  <!-- "학습 멈춤" 레이블 -->
  <rect x="356" y="155" width="100" height="22" rx="4" fill="#FAECE7" stroke="#D85A30" stroke-width="0.8"/>
  <text x="406" y="170" font-family="sans-serif" font-size="11" fill="#D85A30" text-anchor="middle">학습이 멈춘 것처럼 보임</text>

  <!-- plateau 이후 다시 내려가는 구간 -->
  <circle cx="610" cy="215" r="7" fill="#185FA5" stroke="white" stroke-width="2"/>
  <circle cx="670" cy="252" r="7" fill="#185FA5" stroke="white" stroke-width="2"/>
  <circle cx="730" cy="284" r="7" fill="#185FA5" stroke="white" stroke-width="2"/>
  <circle cx="790" cy="301" r="7" fill="#185FA5" stroke="white" stroke-width="2"/>

  <path d="M556,205 Q580,209 608,214" fill="none" stroke="#185FA5" stroke-width="2.4" marker-end="url(#ag)"/>
  <path d="M612,216 Q638,231 668,251" fill="none" stroke="#185FA5" stroke-width="2.4" marker-end="url(#ag)"/>
  <path d="M672,253 Q699,266 728,283" fill="none" stroke="#185FA5" stroke-width="2.4" marker-end="url(#ag)"/>
  <path d="M732,285 Q759,293 788,300" fill="none" stroke="#185FA5" stroke-width="2.4" marker-end="url(#ag)"/>

  <!-- 기울기 크기 표시 화살표 (왼쪽: 가파름, 가운데: 평탄, 오른쪽: 가파름) -->
  <text x="155" y="260" font-family="sans-serif" font-size="11" fill="#444441" text-anchor="middle">기울기 큼</text>
  <text x="155" y="275" font-family="sans-serif" font-size="11" fill="#444441" text-anchor="middle">→ 빠른 이동</text>

  <text x="700" y="200" font-family="sans-serif" font-size="11" fill="#444441" text-anchor="middle">기울기 큼</text>
  <text x="700" y="215" font-family="sans-serif" font-size="11" fill="#444441" text-anchor="middle">→ 빠른 이동</text>

  <!-- 하단 설명 -->
  <text x="500" y="390" font-family="sans-serif" font-size="13" fill="#5F5E5A" text-anchor="middle">기울기가 0에 가까운 평탄 구간에서 가중치 업데이트가 거의 일어나지 않아 학습이 정체된다.</text>
</svg>
