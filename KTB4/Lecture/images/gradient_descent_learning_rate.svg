<svg width="1000" viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" style="background:white">
  <title>학습률 비교: 수렴 vs 진동</title>
  <desc>왼쪽은 작은 학습률로 수렴, 오른쪽은 큰 학습률로 진동</desc>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ax" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 공식 -->
  <text x="500" y="30" font-family="sans-serif" font-size="16" font-weight="600" fill="#2C2C2A" text-anchor="middle">xₙ = xₙ₋₁ − α∇f(xₙ₋₁)</text>

  <!-- ====== 왼쪽: 수렴 ====== -->
  <line x1="50" y1="325" x2="440" y2="325" stroke="#888780" stroke-width="1.2" marker-end="url(#ax)"/>
  <line x1="70" y1="335" x2="70" y2="55" stroke="#888780" stroke-width="1.2" marker-end="url(#ax)"/>
  <text x="448" y="329" font-family="sans-serif" font-size="13" fill="#888780">x</text>
  <text x="58" y="52" font-family="sans-serif" font-size="13" fill="#888780">f(x)</text>

  <!-- 1. 곡선 (꼭짓점: 250, 295), y=295-0.016*(x-250)^2 -->
  <!-- x=90:  295-0.016*25600=295-409.6 → clamp, use x=100: 295-0.016*22500=295-360=-65 too steep -->
  <!-- k=0.008: x=100: 295-0.008*22500=295-180=115  x=150:295-0.008*10000=295-80=215 x=200:295-0.008*2500=275 x=250:295 -->
  <path d="M100,115 L130,183 L160,237 L190,273 L220,290 L235,294 L250,295 L265,294 L280,290 L310,273 L340,237 L370,183 L400,115"
        fill="none" stroke="#444441" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="250" cy="295" r="5" fill="#444441"/>
  <text x="250" y="313" font-family="sans-serif" font-size="12" fill="#444441" text-anchor="middle">최솟값</text>

  <!-- 2. 수렴 점 (곡선 위, y=295-0.008*(x-250)^2)
       x=115: 295-0.008*18225=295-146=149
       x=142: 295-0.008*11664=295-93=202
       x=170: 295-0.008*6400=295-51=244
       x=200: 295-0.008*2500=275
       x=222: 295-0.008*784=295-6.3=289
  -->
  <circle cx="115" cy="149" r="7" fill="#185FA5" stroke="white" stroke-width="2"/>
  <circle cx="142" cy="202" r="7" fill="#185FA5" stroke="white" stroke-width="2"/>
  <circle cx="170" cy="244" r="7" fill="#185FA5" stroke="white" stroke-width="2"/>
  <circle cx="200" cy="275" r="7" fill="#185FA5" stroke="white" stroke-width="2"/>
  <circle cx="222" cy="289" r="7" fill="#185FA5" stroke="white" stroke-width="2"/>

  <!-- 3. 화살표 -->
  <path d="M115,149 Q127,170 140,201" fill="none" stroke="#185FA5" stroke-width="2.4" marker-end="url(#ab)"/>
  <path d="M144,201 Q155,218 168,243" fill="none" stroke="#185FA5" stroke-width="2.4" marker-end="url(#ab)"/>
  <path d="M172,243 Q184,257 198,274" fill="none" stroke="#185FA5" stroke-width="2.4" marker-end="url(#ab)"/>
  <path d="M202,274 Q210,280 220,288" fill="none" stroke="#185FA5" stroke-width="2.4" marker-end="url(#ab)"/>

  <text x="250" y="355" font-family="sans-serif" font-size="13" fill="#185FA5" text-anchor="middle">α가 작은 경우 (수렴)</text>

  <!-- ====== 오른쪽: 진동 ====== -->
  <line x1="560" y1="325" x2="960" y2="325" stroke="#888780" stroke-width="1.2" marker-end="url(#ax)"/>
  <line x1="578" y1="335" x2="578" y2="55" stroke="#888780" stroke-width="1.2" marker-end="url(#ax)"/>
  <text x="968" y="329" font-family="sans-serif" font-size="13" fill="#888780">x</text>
  <text x="566" y="52" font-family="sans-serif" font-size="13" fill="#888780">f(x)</text>

  <!-- 1. 곡선 (꼭짓점: 760, 295), y=295-0.008*(x-760)^2 -->
  <!-- x=610: 295-0.008*22500=115  x=640:295-0.008*14400=180  x=670:295-0.008*8100=230
       x=700:295-0.008*3600=266  x=730:295-0.008*900=288  x=760:295
       x=790:288  x=820:266  x=850:230  x=880:180  x=910:115 -->
  <path d="M610,115 L640,180 L670,230 L700,266 L730,288 L745,293 L760,295 L775,293 L790,288 L820,266 L850,230 L880,180 L910,115"
        fill="none" stroke="#444441" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="760" cy="295" r="5" fill="#444441"/>
  <text x="760" y="313" font-family="sans-serif" font-size="12" fill="#444441" text-anchor="middle">최솟값</text>

  <!-- 2. 진동 점 (비대칭, 곡선 위)
       p1 좌: x=625, y=295-0.008*(625-760)^2=295-0.008*18225=295-146=149
       p2 우: x=893, y=295-0.008*(893-760)^2=295-0.008*17689=295-141=154
       p3 좌: x=648, y=295-0.008*(648-760)^2=295-0.008*12544=295-100=195
       p4 우: x=872, y=295-0.008*(872-760)^2=295-0.008*12544=195  (adjust) x=868: 295-0.008*11664=295-93=202
       p5 좌: x=675, y=295-0.008*(675-760)^2=295-0.008*7225=295-58=237
       p6 우: x=848, y=295-0.008*(848-760)^2=295-0.008*7744=295-62=233
  -->
  <circle cx="625" cy="149" r="7" fill="#D85A30" stroke="white" stroke-width="2"/>
  <circle cx="893" cy="154" r="7" fill="#D85A30" stroke="white" stroke-width="2"/>
  <circle cx="648" cy="195" r="7" fill="#D85A30" stroke="white" stroke-width="2"/>
  <circle cx="868" cy="202" r="7" fill="#D85A30" stroke="white" stroke-width="2"/>
  <circle cx="675" cy="237" r="7" fill="#D85A30" stroke="white" stroke-width="2"/>
  <circle cx="848" cy="233" r="7" fill="#D85A30" stroke="white" stroke-width="2"/>

  <!-- 3. 화살표 (대각선) -->
  <line x1="628" y1="151" x2="889" y2="155" stroke="#D85A30" stroke-width="2.4" marker-end="url(#ar)"/>
  <line x1="889" y1="156" x2="651" y2="196" stroke="#D85A30" stroke-width="2.4" marker-end="url(#ar)"/>
  <line x1="651" y1="197" x2="864" y2="203" stroke="#D85A30" stroke-width="2.4" marker-end="url(#ar)"/>
  <line x1="863" y1="204" x2="678" y2="237" stroke="#D85A30" stroke-width="2.4" marker-end="url(#ar)"/>
  <line x1="679" y1="238" x2="844" y2="234" stroke="#D85A30" stroke-width="2.4" marker-end="url(#ar)"/>

  <text x="760" y="355" font-family="sans-serif" font-size="13" fill="#D85A30" text-anchor="middle">α가 너무 큰 경우 (진동)</text>

  <!-- 구분선 -->
  <line x1="500" y1="45" x2="500" y2="365" stroke="#D3D1C7" stroke-width="1.2" stroke-dasharray="5,4"/>

  <!-- 하단 설명 -->
  <text x="500" y="395" font-family="sans-serif" font-size="13" fill="#5F5E5A" text-anchor="middle">학습률은 단지 기울기에 곱하는 상수임을 알 수 있다.</text>
</svg>
